<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f8f7" />
    <meta name="description" content="VinOrbits is temporarily unavailable while we carry out maintenance. Please check back shortly." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VinOrbits" />
    <meta property="og:title" content="VinOrbits — Maintenance in Progress" />
    <meta property="og:description" content="VinOrbits is temporarily unavailable while we carry out maintenance. Please check back shortly." />
    <title>VinOrbits — Maintenance in Progress</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1c2e40;
        background: #f7f8f7;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * { box-sizing: border-box; }
      html, body { min-width: 320px; min-height: 100%; margin: 0; }
      body { min-height: 100vh; background: #f7f8f7; }
      .maintenance {
        width: min(1160px, calc(100% - 64px)); min-height: 100vh; margin: 0 auto;
        display: flex; flex-direction: column;
      }
      .header {
        display: flex; align-items: center; justify-content: space-between; gap: 24px;
        min-height: 96px; border-bottom: 1px solid #e4e8e7;
      }
      .brand { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; }
      .brand-mark { display: block; width: 38px; height: 38px; flex: none; }
      .brand-name { color: #172a3d; font-size: 1.15rem; font-weight: 730; letter-spacing: -.045em; }
      .status { display: inline-flex; align-items: center; gap: 9px; color: #596b78; font-size: .85rem; font-weight: 550; }
      .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: #d99643; }
      .main {
        display: grid; grid-template-columns: minmax(0, .95fr) minmax(400px, 1.05fr);
        align-items: center; gap: clamp(40px, 7vw, 96px); flex: 1; padding: 56px 0 64px;
      }
      .message { max-width: 500px; padding: 8px 0; }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 10px; margin: 0 0 24px;
        color: #586d7c; font-size: .72rem; font-weight: 760; letter-spacing: .12em; line-height: 1.5;
      }
      .eyebrow .dot { width: 7px; height: 7px; }
      h1 {
        max-width: 10ch; margin: 0; color: #172a3d; font-size: clamp(3rem, 5.2vw, 4.8rem);
        font-weight: 680; letter-spacing: -.067em; line-height: 1.02; text-wrap: balance;
      }
      .copy { max-width: 420px; margin: 24px 0 0; color: #586975; font-size: 1.06rem; line-height: 1.75; }
      .thanks { margin: 22px 0 0; color: #263c4f; font-size: .96rem; font-weight: 650; }
      .art-panel {
        display: grid; min-height: 390px; place-items: center; overflow: hidden;
        border: 1px solid #e5ebea; border-radius: 22px; background: #eef3f2;
      }
      .illustration { display: block; width: min(100%, 620px); height: auto; padding: 12px; }
      .footer {
        display: flex; align-items: center; justify-content: space-between; gap: 20px;
        min-height: 72px; border-top: 1px solid #e4e8e7; color: #71808a; font-size: .78rem;
      }
      .footer span:first-child { font-size: .69rem; font-weight: 730; letter-spacing: .09em; }
      @media (max-width: 820px) {
        .maintenance { width: min(100% - 40px, 620px); }
        .header { min-height: 82px; }
        .main { grid-template-columns: 1fr; gap: 34px; padding: 56px 0 48px; }
        .message { max-width: 600px; }
        h1 { max-width: 12ch; font-size: clamp(3rem, 9vw, 4.5rem); }
        .art-panel { min-height: 0; }
        .illustration { width: min(100%, 560px); }
      }
      @media (max-width: 520px) {
        .maintenance { width: calc(100% - 36px); }
        .status { gap: 7px; max-width: 135px; font-size: .72rem; line-height: 1.35; text-align: right; }
        .main { gap: 30px; padding: 45px 0 38px; }
        .eyebrow { margin-bottom: 20px; font-size: .64rem; }
        h1 { max-width: 11ch; font-size: clamp(2.8rem, 13vw, 3.75rem); }
        .copy { margin-top: 18px; font-size: .98rem; }
        .footer { align-items: flex-start; flex-direction: column; justify-content: center; gap: 7px; min-height: 80px; }
      }
    </style>
  </head>
  <body>
    <div class="maintenance">
      <header class="header">
        <a class="brand" href="/" aria-label="VinOrbits">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="16" fill="#14243a" />
            <ellipse cx="32" cy="32" rx="23" ry="10" transform="rotate(-34 32 32)" fill="none" stroke="#85d7ec" stroke-width="2.5" />
            <ellipse cx="32" cy="32" rx="17" ry="7" transform="rotate(38 32 32)" fill="none" stroke="#e9a95b" stroke-width="1.5" opacity=".8" />
            <path d="M24 23 32 42 40 23" fill="none" stroke="#f5f3ea" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="48" cy="18" r="3.5" fill="#f4a64d" />
          </svg>
          <span class="brand-name">VinOrbits</span>
        </a>
        <span class="status"><span class="dot" aria-hidden="true"></span>Maintenance in progress</span>
      </header>
      <main class="main">
        <section class="message" aria-labelledby="maintenance-title">
          <p class="eyebrow"><span class="dot" aria-hidden="true"></span>WE’RE MAKING A FEW IMPROVEMENTS</p>
          <h1 id="maintenance-title">We’ll be back soon.</h1>
          <p class="copy">VinOrbits is temporarily unavailable while we carry out maintenance. Please check back shortly.</p>
          <p class="thanks">Thank you for your patience.</p>
        </section>
        <div class="art-panel" aria-hidden="true">
          <svg class="illustration" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" fill="none">
            <rect width="720" height="520" rx="24" fill="#eef3f2" />
            <circle cx="360" cy="245" r="178" fill="#e3ecec" />
            <circle cx="360" cy="245" r="146" stroke="#d5e1e1" stroke-width="2" />
            <rect x="94" y="70" width="532" height="352" rx="20" fill="#fff" stroke="#cfdadb" stroke-width="2" />
            <path d="M95 91a20 20 0 0 1 20-20h490a20 20 0 0 1 20 20v48H95V91Z" fill="#f4f7f7" />
            <path d="M95 139h530" stroke="#e0e7e7" stroke-width="2" />
            <circle cx="124" cy="105" r="6" fill="#d88778" />
            <circle cx="146" cy="105" r="6" fill="#ddb86a" />
            <circle cx="168" cy="105" r="6" fill="#80a99a" />
            <rect x="244" y="95" width="232" height="20" rx="10" fill="#e8eeee" />
            <rect x="152" y="170" width="416" height="178" rx="14" fill="#f8fafa" />
            <circle cx="360" cy="250" r="58" fill="#e5eff0" />
            <path d="M374 207a32 32 0 0 0-39 41l-39 39a11 11 0 0 0 16 16l39-39a32 32 0 0 0 41-39l-18 18-15-4-4-15 19-17Z" fill="#294b61" />
            <circle cx="361" cy="249" r="8" fill="#d99a4a" />
            <rect x="262" y="371" width="196" height="8" rx="4" fill="#dee7e7" />
            <rect x="262" y="371" width="122" height="8" rx="4" fill="#6f9699" />
            <circle cx="488" cy="375" r="5" fill="#d99a4a" />
            <rect x="538" y="385" width="66" height="48" rx="10" fill="#d99a4a" />
            <path d="M554 385v-7a17 17 0 0 1 34 0v7" stroke="#b47c36" stroke-width="6" stroke-linecap="round" />
            <path d="M551 403h40" stroke="#f5d7a8" stroke-width="4" stroke-linecap="round" />
            <circle cx="128" cy="381" r="9" fill="#d99a4a" />
            <path d="m124 381 3 3 6-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M163 381h63" stroke="#b8c8c8" stroke-width="5" stroke-linecap="round" />
          </svg>
        </div>
      </main>
      <footer class="footer"><span>© 2026 VINORBITS</span><span>We appreciate your patience while we work.</span></footer>
    </div>
  </body>
</html>
